; Waveshare ESP32-S3-Matrix starter
;
;   matrix   -> the real board (QMI8658 IMU, USB-CDC serial)   pio run -e matrix -t upload
;   sim      -> Wokwi simulator (MPU6050 stand-in, UART0 serial) pio run -e sim, then F1 > "Wokwi: Start Simulator"
;   preview  -> desktop terminal preview of the effects         pio run -e preview -t exec

[platformio]
default_envs = matrix

[esp32s3_common]
; espressif32 6.x ships Arduino-ESP32 2.0.x, the same core line as Waveshare's examples
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3FH4R2: 4 MB in-package flash + 2 MB quad PSRAM
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.0
build_flags =
    -DBOARD_HAS_PSRAM

[env:matrix]
extends = esp32s3_common
lib_deps =
    ${esp32s3_common.lib_deps}
    ; 0.1.6 is the version Waveshare tested; it is only published as a git tag
    https://github.com/lewisxhe/SensorLib.git#v0.1.6
build_flags =
    ${esp32s3_common.build_flags}
    ; the board has no USB-UART chip, so Serial goes over native USB
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:sim]
extends = esp32s3_common
build_flags =
    ${esp32s3_common.build_flags}
    -DSIM
    ; Serial -> UART0 so it shows up in Wokwi's serial monitor
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:preview]
platform = native
build_src_filter = -<*> +<../preview/>
build_flags = -std=c++17
