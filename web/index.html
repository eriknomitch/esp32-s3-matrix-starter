<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix Preview</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #15171a;
    --surface: #1d2024;
    --surface-edge: #30343a;
    --pcb: #050505;
    --pcb-edge: rgba(255, 255, 255, 0.07);
    --silkscreen: #f2f2f2;
    --led-off: #242424;
    --text: #e6e6e6;
    --muted: #8a8f98;
    --accent: #5aa9ff;
    --error-bg: #2a1215;
    --error-text: #ffb4b4;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 16px;
  }
  main { width: min(100%, 420px); display: grid; gap: 16px; }

  /* The board is drawn in the same 250 x 268 coordinate space as the reference
     artwork: a 250 x 250 PCB starting at y = 18, with the USB-C shell above it.
     The SVG holds the parts that never change; the canvas on top draws the LEDs. */
  .board {
    position: relative;
    aspect-ratio: 250 / 268;
    margin-block: 28px;  /* room for the near edge to grow when posed in 3D */
    transition: transform 80ms linear;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .board.dragging { cursor: grabbing; }
  .board svg, .board canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .board svg { filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.55)); }
  .pcb { fill: var(--pcb); stroke: var(--pcb-edge); stroke-width: 0.75; }
  .pad { fill: var(--bg); stroke: url(#gold); stroke-width: 2; }
  .label {
    fill: var(--silkscreen);
    font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.1px;
  }

  .status { display: flex; justify-content: space-between; gap: 12px; }
  .name { font-weight: 600; }
  .tilt { color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--surface-edge);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button[hidden] { display: none; }
  .help { color: var(--muted); margin: 0; }
  .error {
    margin: 0;
    padding: 12px;
    border-radius: 8px;
    background: var(--error-bg);
    color: var(--error-text);
    white-space: pre-wrap;
    overflow-x: auto;
    font-size: 12px;
  }
  .error[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="board" title="Drag to tilt, double-click to level">
    <svg viewBox="0 0 250 268" aria-hidden="true">
      <defs>
        <linearGradient id="usb" x1="0" x2="1">
          <stop offset="0" stop-color="#8a8c90"/>
          <stop offset="0.15" stop-color="#e4e6e9"/>
          <stop offset="0.5" stop-color="#b9bcc1"/>
          <stop offset="0.85" stop-color="#eef0f2"/>
          <stop offset="1" stop-color="#8a8c90"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffc861"/>
          <stop offset="0.5" stop-color="#f29a1f"/>
          <stop offset="1" stop-color="#c9740f"/>
        </linearGradient>
      </defs>
      <rect x="77" y="7" width="96" height="20" rx="2.3" fill="url(#usb)"/>
      <rect class="pcb" x="0.4" y="18.4" width="249.2" height="249.2" rx="10"/>
      <g id="pads"></g>
      <text class="label" x="125" y="34" text-anchor="middle">ESP32-S3-Matrix</text>
    </svg>
    <canvas id="leds"></canvas>
  </div>
  <div class="status">
    <span class="name" id="name">loading…</span>
    <span class="tilt" id="tilt"></span>
  </div>
  <div class="controls">
    <button id="next">Next effect</button>
    <button id="center">Level</button>
    <button id="view3d" aria-pressed="true">3D</button>
    <button id="motion" aria-pressed="false" hidden>Device tilt</button>
  </div>
  <p class="help">drag the board or arrows/WASD to tilt · space next effect · colors at full brightness (the board caps them in config.h)</p>
  <pre class="error" id="error" hidden></pre>
</main>

<script type="module">
// Mirrors preview/preview.cpp: same keys, same tilt steps, same 33 ms frame step
// as cfg::kFrameMs. The frame step matters because effects fade once per render.
const FRAME_MS = 33;
const TILT_STEP = 0.25;

// Board geometry in SVG units (viewBox 0 0 250 268), matching the real layout:
// ten through-hole pads per side and the 8x8 LED grid between them.
const VIEW_W = 250;
const PAD_X = [13.5, 236.5];
const PAD_Y0 = 31.13, PAD_PITCH = 24.78, PAD_COUNT = 10, PAD_R = 7.5;
const LED_X0 = 29, LED_Y0 = 42.63, LED_PITCH_X = 25, LED_PITCH_Y = 26;
const LED_W = 17, LED_H = 18, LED_R = 1.5;

const board = document.querySelector('.board');
const canvas = document.getElementById('leds');
const ctx = canvas.getContext('2d');
const nameEl = document.getElementById('name');
const tiltEl = document.getElementById('tilt');
const errorEl = document.getElementById('error');
const motionBtn = document.getElementById('motion');

const pads = document.getElementById('pads');
for (const cx of PAD_X) {
  for (let i = 0; i < PAD_COUNT; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('class', 'pad');
    c.setAttribute('cx', cx);
    c.setAttribute('cy', PAD_Y0 + i * PAD_PITCH);
    c.setAttribute('r', PAD_R);
    pads.append(c);
  }
}

function showError(text) {
  errorEl.textContent = text;
  errorEl.hidden = !text;
}

// Live reload and compile errors from web/serve.mjs. A plain static server
// answers 404 here, which closes the EventSource without retrying.
const events = new EventSource('/events');
events.addEventListener('reload', () => location.reload());
events.addEventListener('build-error', (e) => showError(JSON.parse(e.data)));

let mod;
try {
  const { default: createEffects } = await import('./build/effects.mjs');
  mod = await createEffects();
} catch (err) {
  showError(`Could not load build/effects.mjs. Run: node web/serve.mjs\n\n${err}`);
  throw err;
}

const W = mod._web_width();
const H = mod._web_height();
const pixelsPtr = mod._web_pixels();

let tiltX = 0, tiltY = 0;
let useMotion = false;
const clamp = (v) => Math.max(-1, Math.min(1, v));

function next() {
  mod._web_next();
  nameEl.textContent = mod.UTF8ToString(mod._web_name());
}

mod._web_select(0);
nameEl.textContent = mod.UTF8ToString(mod._web_name());

// --- input ---

document.addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const step = {
    ArrowLeft: [-1, 0], a: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0],
    ArrowUp: [0, -1], w: [0, -1],
    ArrowDown: [0, 1], s: [0, 1],
  }[k];
  if (step && !useMotion) {
    tiltX = clamp(tiltX + step[0] * TILT_STEP);
    tiltY = clamp(tiltY + step[1] * TILT_STEP);
  } else if (k === ' ' || k === 'n') {
    next();
  } else {
    return;
  }
  e.preventDefault();
});

document.getElementById('next').addEventListener('click', next);
document.getElementById('center').addEventListener('click', () => { tiltX = tiltY = 0; });

// Mouse/touch drag, like rotating an object in a 3D viewer: dragging right
// pushes the right edge down (+tiltX), dragging down pushes the bottom edge
// down (+tiltY). Dragging half the board's width adds 1 g. The tilt stays
// where you let go, the same as keyboard tilt.
let drag = null;
board.addEventListener('pointerdown', (e) => {
  if (useMotion || e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, tiltX, tiltY, half: board.offsetWidth / 2 };
  board.setPointerCapture(e.pointerId);
  board.classList.add('dragging');
});
board.addEventListener('pointermove', (e) => {
  if (!drag) return;
  tiltX = clamp(drag.tiltX + (e.clientX - drag.x) / drag.half);
  tiltY = clamp(drag.tiltY + (e.clientY - drag.y) / drag.half);
});
const endDrag = () => {
  drag = null;
  board.classList.remove('dragging');
};
board.addEventListener('pointerup', endDrag);
board.addEventListener('pointercancel', endDrag);
board.addEventListener('dblclick', () => { if (!useMotion) tiltX = tiltY = 0; });

// Phone/tablet tilt. beta > 0 means the top edge is raised (bottom edge down),
// gamma > 0 means the right edge is down, matching the +tiltY / +tiltX convention
// in Effects.h. The vector is rotated so it stays screen-relative in landscape.
// Browsers only deliver these events on HTTPS or localhost.
const hasReading = (e) => e.beta != null && e.gamma != null;
let gotReading = false;

function onOrientation(e) {
  if (!hasReading(e)) return;
  gotReading = true;
  const rad = Math.PI / 180;
  const dx = Math.sin(e.gamma * rad);
  const dy = Math.sin(e.beta * rad);
  const a = (screen.orientation?.angle ?? 0) * rad;
  tiltX = clamp(dx * Math.cos(a) + dy * Math.sin(a));
  tiltY = clamp(-dx * Math.sin(a) + dy * Math.cos(a));
}

function setMotion(on) {
  useMotion = on;
  motionBtn.setAttribute('aria-pressed', on);
  if (on) addEventListener('deviceorientation', onOrientation);
  else removeEventListener('deviceorientation', onOrientation);
}

// Desktop browsers expose DeviceOrientationEvent without having a sensor; per
// the spec they then fire one event with null angles, which hides the button.
// Browsers that need permission first (iOS, and recent desktop Chrome) send
// nothing until it is granted, so for them the button starts visible and is
// turned back off (and hidden) if no reading follows a click.
if ('DeviceOrientationEvent' in window && window.isSecureContext) {
  const needsPermission = typeof DeviceOrientationEvent.requestPermission === 'function';
  motionBtn.hidden = !needsPermission;
  const probe = (e) => {
    motionBtn.hidden = !hasReading(e);
    removeEventListener('deviceorientation', probe);
  };
  addEventListener('deviceorientation', probe);
  motionBtn.addEventListener('click', async () => {
    if (useMotion) return setMotion(false);
    if (needsPermission) {
      try {
        if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
      } catch { return; }
    }
    setMotion(true);
    setTimeout(() => {
      if (useMotion && !gotReading) {
        setMotion(false);
        motionBtn.hidden = true;
      }
    }, 1000);
  });
}

// --- 3D board pose ---

// The board rotates about one axis, perpendicular to the tilt direction, by an
// angle from the tilt magnitude (in g, so asin gives the real angle). That is
// scaled so 1 g (board on edge, 90 degrees) shows as MAX_VIEW_DEG, not edge-on.
// Two stacked rotateX/rotateY calls would shear the board at large angles.
const MAX_VIEW_DEG = 30;
const view3dBtn = document.getElementById('view3d');
let view3d = true;

view3dBtn.addEventListener('click', () => {
  view3d = !view3d;
  view3dBtn.setAttribute('aria-pressed', view3d);
  if (!view3d) board.style.transform = '';
});

function poseBoard() {
  if (!view3d) return;
  const g = Math.min(1, Math.hypot(tiltX, tiltY));
  const deg = Math.asin(g) / (Math.PI / 2) * MAX_VIEW_DEG;
  // Right edge down is +rotateY, bottom edge down is -rotateX, so the axis is (-tiltY, tiltX).
  board.style.transform = g > 0
    ? `perspective(1600px) rotate3d(${-tiltY}, ${tiltX}, 0, ${deg}deg)`
    : '';
}

// --- drawing ---

function resize() {
  canvas.width = Math.round(canvas.clientWidth * devicePixelRatio);
  canvas.height = Math.round(canvas.clientHeight * devicePixelRatio);
}
addEventListener('resize', resize);
resize();

const ledOff = getComputedStyle(document.documentElement).getPropertyValue('--led-off');

// Each LED is its unlit package, with the lit color added on top ('lighter'),
// so dim trail pixels fade into the package instead of to black.
function draw() {
  const px = mod.HEAPU8.subarray(pixelsPtr, pixelsPtr + W * H * 3);
  const s = canvas.width / VIEW_W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.clearRect(0, 0, VIEW_W, canvas.height / s);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 3;
      const [cr, cg, cb] = [px[i], px[i + 1], px[i + 2]];
      const level = Math.max(cr, cg, cb) / 255;
      const lx = LED_X0 + x * LED_PITCH_X, ly = LED_Y0 + y * LED_PITCH_Y;

      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = 0;
      ctx.fillStyle = ledOff;
      ctx.beginPath();
      ctx.roundRect(lx, ly, LED_W, LED_H, LED_R);
      ctx.fill();

      if (level > 0.02) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 14 * s * level;  // shadowBlur is in device pixels
        ctx.fill();
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;
}

// Effect time advances at most 100 ms per frame, so a backgrounded tab doesn't
// hand Marble a multi-second dt when it comes back.
let clock = 0, lastNow = null, nextFrame = 0;
function tick(now) {
  if (now >= nextFrame) {
    nextFrame = now + FRAME_MS;
    clock += lastNow == null ? 0 : Math.min(now - lastNow, 100);
    lastNow = now;
    mod._web_render(Math.round(clock) >>> 0, tiltX, tiltY);
    draw();
    poseBoard();
    tiltEl.textContent = `tilt x=${tiltX >= 0 ? '+' : ''}${tiltX.toFixed(2)} y=${tiltY >= 0 ? '+' : ''}${tiltY.toFixed(2)}`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
