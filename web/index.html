<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix Preview</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #15171a;
    --surface: #1d2024;
    --surface-edge: #30343a;
    --pcb: #050505;
    --pcb-edge: rgba(255, 255, 255, 0.07);
    --silkscreen: #f2f2f2;
    --panel: #16181b;
    --panel-back: #0f1113;
    --panel-edge: #2a2d32;
    --led-off-board: #242424;
    --led-off-matrix: #202328;
    --text: #e6e6e6;
    --muted: #8a8f98;
    --accent: #5aa9ff;
    --error-bg: #2a1215;
    --error-text: #ffb4b4;
    --viewport-edge: #24272c;
    --viewport-dot: rgba(255, 255, 255, 0.05);
    --hud-line: rgba(255, 255, 255, 0.16);
    --axis-x: #ff6b6b;
    --axis-y: #63d471;
    --axis-z: #5aa9ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 16px;
    overflow-x: clip;
  }
  main { width: min(100%, 600px); display: grid; gap: 16px; }

  /* The stage is a fixed viewport, never transformed, so it stays a stable drag
     target even when the board is edge-on. The board is 64% of its shorter
     side: its corners are 0.733 board widths from the center it turns about,
     so it stays inside in every orientation and never runs into the text
     below. The height leaves room for that text on short screens. The device
     inside rotates in 3D and has two faces; whichever one points at the viewer
     is drawn. */
  .stage {
    position: relative;
    height: min(calc(100vw - 32px), 600px, max(300px, calc(100svh - 220px)));
    container-type: size;
    display: grid;
    place-items: center;
    perspective: 1600px;
    border: 1px solid var(--viewport-edge);
    border-radius: 14px;
    background: radial-gradient(circle, var(--viewport-dot) 1px, transparent 1.5px) center / 24px 24px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .stage.dragging { cursor: grabbing; }
  .device {
    position: relative;
    width: 64cqmin;
    transform-style: preserve-3d;
    transition: transform 80ms linear;
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
  }
  .device { --z: 0.5px; }  /* half the board's thickness: how far each face sits from the middle */
  .view-board { --z: 4px; }
  .face.front { transform: translateZ(var(--z)); }
  .face.back { transform: rotateY(180deg) translateZ(var(--z)); }
  /* The board's edge: a stack of thin PCB-shaped slices between the two faces. */
  .edge {
    position: absolute;
    left: 0;
    right: 0;
    top: 6.72%;  /* 18 / 268, where the PCB starts under the USB-C shell */
    bottom: 0;
    border-radius: 4%;
    background: #a98238;
  }
  .view-matrix .edge { display: none; }
  .face svg, .face canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Board view: the real board's 250 x 268 layout, a 250 x 250 PCB starting at
     y = 18 with the USB-C shell above it. The SVG holds the parts that never
     change; the canvas on top draws the LEDs. */
  .view-board { aspect-ratio: 250 / 268; }
  .view-board svg { filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.55)); }
  .pcb { fill: var(--pcb); stroke: rgba(214, 178, 96, 0.6); stroke-width: 0.8; }
  .pad { fill: var(--bg); stroke: url(#gold); stroke-width: 2.4; }
  .label, .pin, .mark {
    fill: var(--silkscreen);
    font: 600 7px system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .label { font-size: 10px; letter-spacing: 0.1px; }
  .mark { font-size: 7.5px; }
  .chip { fill: #101010; stroke: #cfcfcf; stroke-width: 0.9; stroke-dasharray: 0.9 1.7; }
  .chiptxt { fill: #8c8c8c; font: 500 5.5px ui-monospace, Menlo, monospace; }
  .smd { fill: #b9b9b9; }
  .metal { fill: #c9ccd0; }

  /* Matrix view: a plain panel of round LEDs, not tied to this board. */
  .view-matrix { aspect-ratio: 1; }
  .view-matrix svg { display: none; }
  .view-matrix .face {
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
  }
  .view-matrix .face.front { background: var(--panel); }
  .view-matrix .face.back { background: var(--panel-back); }

  /* Readouts in the viewport's top corners, clear of the board's reach. */
  .hud {
    position: absolute;
    top: 8px;
    z-index: 1;
    width: clamp(56px, 15cqmin, 90px);
    margin: 0;
    display: grid;
    justify-items: center;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.3;
  }
  .hud.pose { left: 8px; }
  .hud.gravity { right: 8px; }
  .hud canvas { width: 100%; aspect-ratio: 1; }

  .status { display: flex; justify-content: space-between; gap: 12px; }
  .name { font-weight: 600; }
  .tilt { color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .segmented { display: inline-flex; }
  .segmented button { border-radius: 0; }
  .segmented button:first-child { border-radius: 8px 0 0 8px; }
  .segmented button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--surface-edge);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); position: relative; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); position: relative; }
  button[hidden] { display: none; }
  .help { color: var(--muted); margin: 0; }
  .error {
    margin: 0;
    padding: 12px;
    border-radius: 8px;
    background: var(--error-bg);
    color: var(--error-text);
    white-space: pre-wrap;
    overflow-x: auto;
    font-size: 12px;
  }
  .error[hidden] { display: none; }
</style>
</head>

<script type="module">
// Same frame step as cfg::kFrameMs. It matters because effects fade once per render.
const FRAME_MS = 33;
const KEY_STEP_DEG = 15;  // about 0.26 g near level, close to preview.cpp's 0.25 g steps

// LED layouts, in each view's own units. The board view matches the real
// board: ten through-hole pads per side and the 8x8 grid between them.
const PAD_X = [9, 241];
const PAD_Y0 = 29, PAD_PITCH = 25.4, PAD_COUNT = 10, PAD_R = 4.6;

// Silkscreen pin names: one per gap between pads, and the last one beside the
// bottom pad. The back shows them with the sides swapped.
const POWER_SIDE = ['5V', 'G', '3V3', '7', '6', '5', '4', '3', '2'];
const GPIO_SIDE = ['33', '34', '35', '36', '37', '38', '39', '40', 'TX'];
const PIN_NAMES = {
  front: { left: [POWER_SIDE, '1'], right: [GPIO_SIDE, 'RX'] },
  back: { left: [GPIO_SIDE, 'RX'], right: [POWER_SIDE, '1'] },
};

// The board view paints its LEDs with drawBoardLeds() (package, lens, bloom).
// The plain matrix has dark LEDs, so there the color is simply added to them.
const LAYOUTS = {
  board: { viewW: 250, photo: true },
  matrix: {
    viewW: 100,
    off: null,  // read from the --led-off-matrix CSS variable
    glow: 5.75,
    additive: true,
    path(ctx, x, y) {
      const cell = 11.5;  // 92 units of grid inside a 4-unit inset
      ctx.arc(4 + (x + 0.5) * cell, 4 + (y + 0.5) * cell, cell * 0.36, 0, Math.PI * 2);
    },
  },
};

const stage = document.querySelector('.stage');
const device = document.getElementById('device');
const canvas = document.getElementById('leds');
const ctx = canvas.getContext('2d');
const nameEl = document.getElementById('name');
const tiltEl = document.getElementById('tilt');
const errorEl = document.getElementById('error');
const motionBtn = document.getElementById('motion');
const poseCanvas = document.getElementById('pose');
const poseCtx = poseCanvas.getContext('2d');
const gravityCanvas = document.getElementById('gravity');
const gravityCtx = gravityCanvas.getContext('2d');

function svgEl(name, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text) el.textContent = text;
  return el;
}

for (const g of document.querySelectorAll('.pads')) {
  const names = PIN_NAMES[g.dataset.face];
  PAD_X.forEach((cx, side) => {
    const [gaps, last] = names[side ? 'right' : 'left'];
    for (let i = 0; i < PAD_COUNT; i++) {
      const cy = PAD_Y0 + i * PAD_PITCH;
      g.append(svgEl('circle', { class: 'pad', cx, cy, r: PAD_R }));
      if (i < gaps.length) {
        g.append(svgEl('text', { class: 'pin', x: cx, y: cy + PAD_PITCH / 2 + 2.4, 'text-anchor': 'middle' }, gaps[i]));
      }
    }
    g.append(svgEl('text', {
      class: 'pin', x: side ? 231 : 19, y: PAD_Y0 + (PAD_COUNT - 1) * PAD_PITCH + 2.6,
      'text-anchor': side ? 'end' : 'start',
    }, last));
  });
}

// The board's edge: thin slices between the two faces (see .edge in the CSS).
for (let i = 0; i < 8; i++) {
  const slice = document.createElement('div');
  slice.className = 'edge';
  slice.style.transform = `translateZ(${i - 3.5}px)`;
  document.getElementById('device').prepend(slice);
}

function showError(text) {
  errorEl.textContent = text;
  errorEl.hidden = !text;
}

// Live reload and compile errors from web/serve.mjs. A plain static server
// answers 404 here, which closes the EventSource without retrying.
const events = new EventSource('/events');
events.addEventListener('reload', () => location.reload());
events.addEventListener('build-error', (e) => showError(JSON.parse(e.data)));

let mod;
try {
  const { default: createEffects } = await import('./build/effects.mjs');
  mod = await createEffects();
} catch (err) {
  showError(`Could not load build/effects.mjs. Run: node web/serve.mjs\n\n${err}`);
  throw err;
}

const W = mod._web_width();
const H = mod._web_height();
const pixelsPtr = mod._web_pixels();

function next() {
  mod._web_next();
  nameEl.textContent = mod.UTF8ToString(mod._web_name());
}

mod._web_select(0);
nameEl.textContent = mod.UTF8ToString(mod._web_name());

// --- board orientation ---

// The board's orientation is the source of truth, as a unit quaternion
// [w, x, y, z] in CSS's frame (x right, y down, z toward the viewer). Level
// means lying face up with the viewer looking straight down at it. The tilt
// the effects see is derived from it, the way the real IMU measures it.
let q = [1, 0, 0, 0];
let leveling = false;

function qMul([aw, ax, ay, az], [bw, bx, by, bz]) {
  return [
    aw * bw - ax * bx - ay * by - az * bz,
    aw * bx + ax * bw + ay * bz - az * by,
    aw * by - ax * bz + ay * bw + az * bx,
    aw * bz + ax * by - ay * bx + az * bw,
  ];
}
const qNorm = (a) => { const n = Math.hypot(...a); return a.map((v) => v / n); };
function qAxisAngle(x, y, z, rad) {
  const n = Math.hypot(x, y, z);
  if (!n || !rad) return [1, 0, 0, 0];
  const s = Math.sin(rad / 2) / n;
  return [Math.cos(rad / 2), x * s, y * s, z * s];
}

// Turn the board about a screen-space axis. Screen motion (dx, dy) maps to the
// axis (-dy, dx, 0): moving right pushes the right edge away (down), moving
// down pushes the bottom edge away. There are no limits, so it can roll over.
function turn(dx, dy, rad) {
  leveling = false;
  q = qNorm(qMul(qAxisAngle(-dy, dx, 0, rad), q));
}

// Gravity points away from the viewer (-z). Its x/y components in the board's
// own frame are what the accelerometer reports: +x when the right edge is
// lower, +y when the bottom edge is lower (the convention in Effects.h). Past
// 90 degrees they shrink again, and face down they are 0.
function tiltFromPose() {
  const [w, x, y, z] = q;
  return [2 * (w * y - x * z), -2 * (y * z + w * x)];
}
// How far the LED face points from straight at the viewer, in degrees. Past
// 90 the board is face down.
const offLevelDeg = () =>
  Math.acos(Math.max(-1, Math.min(1, 1 - 2 * (q[1] * q[1] + q[2] * q[2])))) * 180 / Math.PI;

// Eases back to level over a few frames, through the shortest rotation.
function stepLeveling() {
  if (q[0] < 0) q = q.map((v) => -v);
  q = qNorm(q.map((v, i) => v + ((i === 0 ? 1 : 0) - v) * 0.25));
  if (q[0] > 0.99999) {
    q = [1, 0, 0, 0];
    leveling = false;
  }
}

// The board's own x, y and z axes (right edge, bottom edge, out of the LEDs)
// in CSS's frame, which are the columns of its rotation matrix.
function boardAxes() {
  const [w, x, y, z] = q;
  return [
    [1 - 2 * (y * y + z * z), 2 * (x * y + w * z), 2 * (x * z - w * y)],
    [2 * (x * y - w * z), 1 - 2 * (x * x + z * z), 2 * (y * z + w * x)],
    [2 * (x * z + w * y), 2 * (y * z - w * x), 1 - 2 * (x * x + y * y)],
  ];
}

function matrix3d() {
  return `matrix3d(${boardAxes().flatMap((col) => [...col, 0]).join(',')},0,0,0,1)`;
}

// --- input ---

let useMotion = false;

document.addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const step = {
    ArrowLeft: [-1, 0], a: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0],
    ArrowUp: [0, -1], w: [0, -1],
    ArrowDown: [0, 1], s: [0, 1],
  }[k];
  if (step && !useMotion) {
    turn(step[0], step[1], KEY_STEP_DEG * Math.PI / 180);
  } else if (k === ' ' || k === 'n') {
    next();
  } else {
    return;
  }
  e.preventDefault();
});

const level = () => { if (!useMotion) leveling = true; };
document.getElementById('next').addEventListener('click', next);
document.getElementById('center').addEventListener('click', level);
stage.addEventListener('dblclick', level);

// Drag like rolling a trackball: each pointer move turns the board about the
// axis perpendicular to that move, so the axis follows the drag. Half the
// board's width is a quarter turn (90 degrees, 1 g).
let drag = null;
stage.addEventListener('pointerdown', (e) => {
  if (useMotion || e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, half: device.offsetWidth / 2 };
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX;
  drag.y = e.clientY;
  turn(dx, dy, Math.hypot(dx, dy) / drag.half * (Math.PI / 2));
});
const endDrag = () => {
  drag = null;
  stage.classList.remove('dragging');
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

// Phone/tablet tilt. beta > 0 means the top edge is raised (bottom edge down),
// gamma > 0 means the right edge is down, matching the +tiltY / +tiltX convention
// in Effects.h. The vector is rotated so it stays screen-relative in landscape,
// then turned into a board pose with that tilt. Browsers only deliver these
// events on HTTPS or localhost.
const hasReading = (e) => e.beta != null && e.gamma != null;
let gotReading = false;

function onOrientation(e) {
  if (!hasReading(e)) return;
  gotReading = true;
  const rad = Math.PI / 180;
  const dx = Math.sin(e.gamma * rad);
  const dy = Math.sin(e.beta * rad);
  const a = (screen.orientation?.angle ?? 0) * rad;
  const tx = dx * Math.cos(a) + dy * Math.sin(a);
  const ty = -dx * Math.sin(a) + dy * Math.cos(a);
  leveling = false;
  q = qAxisAngle(-ty, tx, 0, Math.asin(Math.min(1, Math.hypot(tx, ty))));
}

function setMotion(on) {
  useMotion = on;
  motionBtn.setAttribute('aria-pressed', on);
  if (on) addEventListener('deviceorientation', onOrientation);
  else removeEventListener('deviceorientation', onOrientation);
}

// Desktop browsers expose DeviceOrientationEvent without having a sensor; per
// the spec they then fire one event with null angles, which hides the button.
// Browsers that need permission first (iOS, and recent desktop Chrome) send
// nothing until it is granted, so for them the button starts visible and is
// turned back off (and hidden) if no reading follows a click.
if ('DeviceOrientationEvent' in window && window.isSecureContext) {
  const needsPermission = typeof DeviceOrientationEvent.requestPermission === 'function';
  motionBtn.hidden = !needsPermission;
  const probe = (e) => {
    motionBtn.hidden = !hasReading(e);
    removeEventListener('deviceorientation', probe);
  };
  addEventListener('deviceorientation', probe);
  motionBtn.addEventListener('click', async () => {
    if (useMotion) return setMotion(false);
    if (needsPermission) {
      try {
        if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
      } catch { return; }
    }
    setMotion(true);
    setTimeout(() => {
      if (useMotion && !gotReading) {
        setMotion(false);
        motionBtn.hidden = true;
      }
    }, 1000);
  });
}

// --- view: realistic board or plain matrix, remembered per browser ---

const VIEW_KEY = 'matrix-preview.view';
const viewButtons = document.querySelectorAll('[data-view]');
let view = 'board';
try {
  if (localStorage.getItem(VIEW_KEY) === 'matrix') view = 'matrix';
} catch {}

function setView(v) {
  view = v;
  device.classList.toggle('view-board', v === 'board');
  device.classList.toggle('view-matrix', v === 'matrix');
  for (const b of viewButtons) b.setAttribute('aria-pressed', b.dataset.view === v);
  resize();
  try { localStorage.setItem(VIEW_KEY, v); } catch {}
}
for (const b of viewButtons) b.addEventListener('click', () => setView(b.dataset.view));

const view3dBtn = document.getElementById('view3d');
let view3d = true;
view3dBtn.addEventListener('click', () => {
  view3d = !view3d;
  view3dBtn.setAttribute('aria-pressed', view3d);
});

// --- drawing ---

function resize() {
  for (const c of [canvas, poseCanvas, gravityCanvas]) {
    c.width = Math.round(c.clientWidth * devicePixelRatio);
    c.height = Math.round(c.clientHeight * devicePixelRatio);
  }
}
addEventListener('resize', resize);
setView(view);

const rootStyle = getComputedStyle(document.documentElement);

// Board LEDs, modelled on photos of the real thing: a warm gray package with a
// dark rim, a lighter lens and a small die. A lit LED tints its package, burns
// to a near-white core, and blooms colored light onto the PCB and its
// neighbors. Packages are painted first so every bloom lands on top of them.
const LED_SIZE = 19;
const ledX = (x) => 31 + x * 27;
const ledY = (y) => 42 + y * 27.4;
const pkgGrad = ctx.createLinearGradient(-9.5, -9.5, 9.5, 9.5);
pkgGrad.addColorStop(0, '#b0a5a3');
pkgGrad.addColorStop(1, '#857b7a');
const lensGrad = ctx.createRadialGradient(-1.5, -1.5, 0, 0, 0, 9);
lensGrad.addColorStop(0, '#cdc3c0');
lensGrad.addColorStop(1, '#978d8b');

function drawBoardLeds(px) {
  const lit = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 3;
      const peak = Math.max(px[i], px[i + 1], px[i + 2]);
      const level = peak / 255;
      ctx.save();
      ctx.translate(ledX(x), ledY(y));
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;

      ctx.fillStyle = pkgGrad;
      ctx.strokeStyle = '#463e3d';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.roundRect(-LED_SIZE / 2, -LED_SIZE / 2, LED_SIZE, LED_SIZE, 2.5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = lensGrad;
      ctx.beginPath();
      ctx.roundRect(-7, -7, 14, 14, 3.5);
      ctx.fill();
      ctx.fillStyle = '#4b3f3f';
      ctx.fillRect(-4.5, -1.6, 3.2, 3.2);
      ctx.fillStyle = '#a8453f';
      ctx.fillRect(-3.6, -0.7, 1.4, 1.4);

      if (level > 0.02) {
        const rgb = [px[i], px[i + 1], px[i + 2]].map((v) => Math.round(v * 255 / peak));
        const color = `${rgb[0]},${rgb[1]},${rgb[2]}`;
        const hot = rgb.map((v) => Math.round(v * 0.35 + 255 * 0.65)).join(',');
        // the package takes on the color...
        ctx.globalAlpha = Math.min(1, 0.1 + level * 0.95);
        ctx.fillStyle = `rgb(${color})`;
        ctx.beginPath();
        ctx.roundRect(-LED_SIZE / 2 + 0.5, -LED_SIZE / 2 + 0.5, LED_SIZE - 1, LED_SIZE - 1, 2.2);
        ctx.fill();
        // ...and the lens burns toward white where the die sits
        const core = ctx.createRadialGradient(-1, 0, 0, -1, 0, 8);
        core.addColorStop(0, `rgba(${hot},${0.95 * level})`);
        core.addColorStop(0.55, `rgba(${hot},${0.3 * level})`);
        core.addColorStop(1, `rgba(${color},0)`);
        ctx.globalAlpha = 1;
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.roundRect(-8.5, -8.5, 17, 17, 2.5);
        ctx.fill();
        lit.push([x, y, color, level]);
      }
      ctx.restore();
    }
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, color, level] of lit) {
    const bloom = ctx.createRadialGradient(ledX(x), ledY(y), 3, ledX(x), ledY(y), 30);
    bloom.addColorStop(0, `rgba(${color},${0.5 * level})`);
    bloom.addColorStop(0.4, `rgba(${color},${0.16 * level})`);
    bloom.addColorStop(1, `rgba(${color},0)`);
    ctx.fillStyle = bloom;
    ctx.fillRect(ledX(x) - 30, ledY(y) - 30, 60, 60);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// Matrix view: each LED is its dark package with the lit color added on top
// ('lighter'), so dim trail pixels fade into the package instead of to black.
function draw() {
  const layout = LAYOUTS[view];
  const px = mod.HEAPU8.subarray(pixelsPtr, pixelsPtr + W * H * 3);
  const s = canvas.width / layout.viewW;
  const off = rootStyle.getPropertyValue('--led-off-matrix');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s, 0, 0, s, 0, 0);
  if (layout.photo) return drawBoardLeds(px);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 3;
      const [cr, cg, cb] = [px[i], px[i + 1], px[i + 2]];
      const peak = Math.max(cr, cg, cb);
      const level = peak / 255;

      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.fillStyle = off;
      ctx.beginPath();
      layout.path(ctx, x, y);
      ctx.fill();

      if (level > 0.02) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = layout.glow * s * level;  // shadowBlur is in device pixels
        ctx.beginPath();
        layout.path(ctx, x, y);
        ctx.fill();
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// The HUDs draw in a 100 x 100 space.
function hudBegin(c) {
  const s = c.canvas.width / 100;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, c.canvas.width, c.canvas.height);
  c.setTransform(s, 0, 0, s, 0, 0);
  c.globalAlpha = 1;
  c.setLineDash([]);
  c.lineCap = 'round';
}

// Axes HUD: the board's axes as the viewer sees them (orthographic, so no
// perspective), around a miniature of the board. Axes pointing away from the
// viewer are drawn faded and behind the board.
function drawPose() {
  const c = poseCtx;
  hudBegin(c);
  const axes = boardAxes();
  const [ax, ay, az] = axes;
  const colors = ['--axis-x', '--axis-y', '--axis-z'].map((v) => rootStyle.getPropertyValue(v));
  const LEN = 34, HALF = 17;

  const drawAxis = (i) => {
    const [vx, vy, vz] = axes[i];
    c.globalAlpha = vz < -0.05 ? 0.45 : 1;
    c.strokeStyle = c.fillStyle = colors[i];
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(50, 50);
    c.lineTo(50 + vx * LEN, 50 + vy * LEN);
    c.stroke();
    c.beginPath();
    c.arc(50 + vx * LEN, 50 + vy * LEN, 3, 0, Math.PI * 2);
    c.fill();
    // Push the label out along the axis, or off to the side when the axis
    // points at the viewer and has no length on screen.
    const len = Math.hypot(vx, vy);
    const [lx, ly] = len > 0.3 ? [vx / len, vy / len] : [0.7, -0.7];
    c.font = '700 13px ui-monospace, Menlo, monospace';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('XYZ'[i], 50 + vx * LEN + lx * 9, 50 + vy * LEN + ly * 9);
  };
  const order = [0, 1, 2].sort((a, b) => axes[a][2] - axes[b][2]);

  for (const i of order) if (axes[i][2] < 0) drawAxis(i);
  // The board, with a tab at its top edge for the USB-C port. Its back is gold
  // like the edge, so a board turned over reads as such.
  const pt = (u, v) => [50 + (ax[0] * u + ay[0] * v) * HALF, 50 + (ax[1] * u + ay[1] * v) * HALF];
  c.globalAlpha = 1;
  c.lineWidth = 1;
  c.fillStyle = az[2] >= 0 ? 'rgba(255, 255, 255, 0.12)' : 'rgba(214, 178, 96, 0.3)';
  c.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  for (const shape of [[[-1, -1], [1, -1], [1, 1], [-1, 1]], [[-0.35, -1], [0.35, -1], [0.35, -1.25], [-0.35, -1.25]]]) {
    c.beginPath();
    for (const [u, v] of shape) c.lineTo(...pt(u, v));
    c.closePath();
    c.fill();
    c.stroke();
  }
  for (const i of order) if (axes[i][2] >= 0) drawAxis(i);
}

// Gravity HUD: a bubble-level plot of the effects' tiltX/tiltY, the x/y of
// gravity in the board's frame. The crosshair takes the axis colors, the
// outer ring is 1 g, and the dot is hollow when the board is face down
// (past 90 degrees the reading shrinks back toward the center).
function drawGravity(tiltX, tiltY, down) {
  const c = gravityCtx;
  hudBegin(c);
  const R = 42;
  const [colX, colY, accent] = ['--axis-x', '--axis-y', '--accent'].map((v) => rootStyle.getPropertyValue(v));
  c.lineWidth = 1;
  c.strokeStyle = rootStyle.getPropertyValue('--hud-line');
  c.beginPath();
  c.arc(50, 50, R, 0, Math.PI * 2);
  c.stroke();
  c.setLineDash([2, 3]);
  c.beginPath();
  c.arc(50, 50, R / 2, 0, Math.PI * 2);
  c.stroke();
  c.setLineDash([]);
  c.globalAlpha = 0.5;
  c.strokeStyle = colX;
  c.beginPath();
  c.moveTo(50 - R, 50);
  c.lineTo(50 + R, 50);
  c.stroke();
  c.strokeStyle = colY;
  c.beginPath();
  c.moveTo(50, 50 - R);
  c.lineTo(50, 50 + R);
  c.stroke();

  const px = 50 + tiltX * R, py = 50 + tiltY * R;
  c.globalAlpha = 0.7;
  c.strokeStyle = accent;
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(50, 50);
  c.lineTo(px, py);
  c.stroke();
  c.globalAlpha = 1;
  c.beginPath();
  c.arc(px, py, 6, 0, Math.PI * 2);
  if (down) {
    c.lineWidth = 2.5;
    c.stroke();
  } else {
    c.fillStyle = accent;
    c.fill();
  }
}

const signed = (v) => {
  const r = Math.round(v * 100) / 100 || 0;  // || 0 turns -0 into 0
  return `${r >= 0 ? '+' : ''}${r.toFixed(2)}`;
};

// Effect time advances at most 100 ms per frame, so a backgrounded tab doesn't
// hand Marble a multi-second dt when it comes back.
let clock = 0, lastNow = null, nextFrame = 0;
function tick(now) {
  if (now >= nextFrame) {
    nextFrame = now + FRAME_MS;
    clock += lastNow == null ? 0 : Math.min(now - lastNow, 100);
    lastNow = now;
    if (leveling) stepLeveling();
    const [tiltX, tiltY] = tiltFromPose();
    mod._web_render(Math.round(clock) >>> 0, tiltX, tiltY);
    draw();
    device.style.transform = view3d ? matrix3d() : '';
    const deg = offLevelDeg();
    drawPose();
    drawGravity(tiltX, tiltY, deg > 90);
    tiltEl.textContent = `tilt x=${signed(tiltX)} y=${signed(tiltY)} · ${Math.round(deg)}°${deg > 90 ? ' face down' : ''}`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
